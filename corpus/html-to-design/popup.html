<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      width: 320px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .content { padding: 16px; }
    .capture-btn {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .capture-btn:hover { background: #5558e6; }
    .capture-btn:disabled { background: #4b5563; cursor: not-allowed; }
    .capture-btn.capturing {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      background: #374151;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.visible { display: block; }
    .status.success { border-left: 3px solid #10b981; }
    .status.error { border-left: 3px solid #ef4444; }
    .export-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #374151;
    }
    .export-btn {
      width: 100%;
      padding: 10px;
      background: #374151;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .export-btn:hover { background: #4b5563; }
    .export-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 8px;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎨</div>
    <h1>html.to.design</h1>
    <p>Convert websites to Figma designs</p>
  </div>
  
  <div class="content">
    <button id="captureBtn" class="capture-btn">
      Capture Page
    </button>
    
    <div id="status" class="status"></div>
    
    <div class="export-section">
      <button id="exportFigma" class="export-btn" disabled>
        Export to Figma (.h2d)
      </button>
      <button id="exportClipboard" class="export-btn" disabled>
        Copy to Clipboard
      </button>
      <button id="exportMake" class="export-btn" disabled>
        Export to Figma Make (.make)
      </button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
